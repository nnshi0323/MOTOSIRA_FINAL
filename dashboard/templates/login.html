<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTOSIRA — Login</title>
<style>
:root{--bg:#14120F;--surface:#1F1B15;--border:#332C1F;--line:#4A4030;--amber:#FFB020;--red:#FF3B30;--muted:#8C8372;--muted2:#5A5346;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#F3EEE2;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--amber);border-radius:4px;padding:38px 34px;width:100%;max-width:370px}
.logo{font-size:30px;font-weight:800;letter-spacing:6px;color:var(--amber);text-align:center}
.sub{font-family:Consolas,"Courier New",monospace;font-size:10px;letter-spacing:1px;color:var(--muted2);text-align:center;margin:6px 0 30px;text-transform:uppercase}
label{display:block;font-family:Consolas,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
input{width:100%;background:#0F0D0B;border:1px solid var(--line);border-radius:2px;padding:12px;color:#fff;font-size:14px;margin-bottom:16px;outline:none}
input:focus{border-color:var(--amber)}
button{width:100%;background:#2A1E05;border:1px solid var(--amber);color:var(--amber);padding:13px;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px}
button:hover{background:#3a2905}
.err{border:1px solid var(--red);color:var(--red);background:#220806;padding:10px;font-size:13px;margin-bottom:16px;text-align:center}
</style>
</head>
<body>
<form class="box" method="POST" action="/login">
  <div class="logo">MOTOSIRA</div>
  <div class="sub">Motorcycle Sound-based Identification &amp; Reporting Assistant</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Login</button>
</form>
</body>
</html>
